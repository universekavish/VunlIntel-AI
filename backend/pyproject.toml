[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "vulnintel-api"
version = "0.1.0"
description = "VulnIntel AI modular-monolith backend"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "celery[redis]>=5.4,<6",
  "fastapi>=0.115,<1",
  "email-validator>=2.2,<3",
  "httpx>=0.28,<1",
  "packaging>=24,<26",
  "python-multipart>=0.0.20,<1",
  "langchain>=0.3,<2",
  "langchain-core>=0.3,<2",
  "langchain-text-splitters>=0.3,<1",
  "qdrant-client>=1.13,<2",
  "langgraph>=0.2,<2",
  "langgraph-checkpoint-postgres>=2,<4",
  "sentence-transformers>=3.3,<6",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.7,<3",
  "pwdlib[argon2]>=0.2.1,<1",
  "PyJWT>=2.10,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
]
ml = [
  "accelerate>=1.2,<2",
  "bitsandbytes>=0.45,<1",
  "datasets>=3.2,<5",
  "mlflow>=2.17,<4",
  "peft>=0.14,<1",
  "torch>=2.4,<3",
  "transformers>=4.46,<6",
  "trl>=0.12,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
  "integration: tests that exercise the application through its HTTP or migration boundary",
  "live: tests that call real official source endpoints",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
