name: VulnIntel CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend
        run: python -m pip install -e "backend[dev]"
      - name: Ruff
        run: python -m ruff check backend ml
      - name: Format
        run: python -m ruff format --check backend ml
      - name: Backend tests
        run: python -m pytest -q backend/tests

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: cd frontend && npm ci
      - name: Typecheck
        run: cd frontend && npm run typecheck
      - name: Lint
        run: cd frontend && npm run lint
      - name: Build
        run: cd frontend && npm run build

  compose:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Create CI environment
        run: cp .env.example .env
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Build Compose images
        run: docker compose build
      - name: Start Compose stack
        run: docker compose up -d
      - name: Wait for application health
        run: |
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8000/health/ready >/dev/null \
              && curl --fail --silent http://127.0.0.1:5173/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --tail=200
          exit 1
      - name: Stop Compose stack
        if: always()
        run: docker compose down --volumes
